<!DOCTYPE html>
<html>
<head>
  <title>Expense Calculator</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
<body>
  <h1>Expense Calculator</h1>
  <form id="expense-form">
    <label for="person">Person:</label>
    <input type="text" id="person" required><br>
    <label for="date">Date:</label>
    <input type="date" id="date" required><br>
    <label for="item">Item:</label>
    <input type="text" id="item" required><br>
    <label for="amount">Amount:</label>
    <input type="number" id="amount" required><br>
    <button type="submit">Add Expense</button>
  </form>
  
  <h2>Expenses List</h2>
  <table id="expenses-table">
    <thead>
      <tr>
        <th>Serial No.</th>
        <th data-sort="person">Person</th>
        <th data-sort="date">Date</th>
        <th data-sort="item">Item</th>
        <th data-sort="amount">Amount</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Expenses will be added here -->
    </tbody>
  </table>

  <h2>Summary</h2>
  <div id="summary"></div>

  <h2>Settlement Amounts</h2>
  <div id="settlement"></div>

  <button id="download">Download PDF</button>
<h6><center>Power By @eswar<center></h6>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.13/jspdf.plugin.autotable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
